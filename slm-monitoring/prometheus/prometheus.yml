
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:

  - job_name: "slm-inference"
    static_configs:
      - targets:
          - "host.docker.internal:9100"

  - job_name: "slm-quality"
    scrape_interval: 30s
    static_configs:
      - targets:
          - "host.docker.internal:9101"
  
  - job_name: "vllm"
    scrape_interval: 15s
    static_configs:
      - targets:
          - "host.docker.internal:8000"